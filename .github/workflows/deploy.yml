name: Deploy Portail Front

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            echo "========================================"
            echo "Déploiement Portail CCIB38"
            echo "========================================"

            cd /home/ubuntu/projets/Madrassa-frontend

            echo ""
            echo "=== Récupération du dernier code ==="

            git fetch origin
            git reset --hard origin/main

            echo ""
            echo "=== Commit déployé ==="

            git log -1 --oneline

            echo ""
            echo "=== Versions Node / npm ==="

            node -v
            npm -v

            echo ""
            echo "=== Installation des dépendances ==="

            npm ci

            echo ""
            echo "=== Build frontend ==="

            npm run build

            echo ""
            echo "=== Vérification du dossier dist ==="

            test -f dist/index.html

            ls -lah dist

            echo ""
            echo "=== Vérification Nginx ==="

            sudo nginx -t

            echo ""
            echo "========================================"
            echo "Déploiement terminé avec succès"
            echo "https://portail.ccib38.fr"
            echo "========================================"